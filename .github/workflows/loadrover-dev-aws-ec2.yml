name: loadrover-io

on:
  push:
    tags:
      - "loadrover-dev-[0-9]+.[0-9]+.[0-9]+" # release tag

jobs:
  build-and-push:
    runs-on:  ubuntu-latest
    steps:
      # docker-compose.yml 파일 복사
      - name: Checkout code
        uses: actions/checkout@v3

      # gradle build 를 위한 jdk 사용
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: "temurin"

      # ./gradlew 권한 설정
      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      # gradle build (배포할 프로젝트 jar 파일 생성)
      - name: Build with Gradle
        run: ./gradlew clean :api:build --exclude-task test
        shell: bash

      # docker hub 로그인 (docker hub username, token 값 필요)
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # docker hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # docker hub token

      # 이전 버전 이미지 삭제
      - name: Delete existing Docker image
        run: docker rmi 2bytesdev/loadrover-io:api || true
        continue-on-error: true

      # docker image build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./api  # dockerfile 저장 경로 -> 프로젝트 최상단 경로부터 시작
          file: ./api/Dockerfile.dev  # dockerfile 파일명
          push: true
          tags: 2bytesdev/loadrover-io:api # docker hub repository name:imageName-tag

  deploy:
    needs: build-and-push
    name: Deploy to AWS EC2
    runs-on: [self-hosted, loadrover-api-dev] # loadrover-api-dev 라는 라벨의 self-hosted runner 사용
    steps:
      # docker hub 로그인 (docker hub username, token 값 필요)
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # docker hub username
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # docker hub token

      # docker-compose install
      - name: Install Docker Compose
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get update
          echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S apt-get install -y docker-compose

      # docker-compose.yml 파일 복사
      - name: Checkout
        uses: actions/checkout@v3

      # docker image run
      - name: Docker Compose up
        run: |
          echo "move to loadrover directory"
          cd /home/loadrover/actions-runner/_work/2bytes.loadrover-server/2bytes.loadrover-server/api

          echo "api docker-compose stop and rm and pull and up"
          if docker-compose ps -q load-test-be >/dev/null; then
            docker-compose -f docker-compose.yml stop api &&
            docker-compose -f docker-compose.yml rm -f api &&
            docker-compose -f docker-compose.yml rm pull api &&
            docker-compose -f docker-compose.yml up -d api
          else
            docker-compose -f docker-compose.yml rm pull api &&
            docker-compose -f docker-compose.yml up -d api
          fi
             
          echo "non-use image remove"
          docker image prune --force
