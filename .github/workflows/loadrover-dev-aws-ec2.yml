name: loadrover-io

on:
  push:
    tags:
      - "loadrover-dev-[0-9]+.[0-9]+.[0-9]+" # release tag

jobs:
  build-and-push:
    name: build-and-push
    runs-on: [self-hosted, loadrover] # loadrover-io-dev 라는 라벨의 self-hosted runner 사용
    steps:
      # docker-compose.yml 파일 복사
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Backup gatling directory
        run: |
          rsync -av ~/loadrover/live-directory/gatling /tmp/gatling

      - name: Sync files excluding gatling
        run: |
          echo "${{ secrets.SUDO_PASSWORD_FE }}" | sudo -S rsync -av --exclude='gatling/' ~/loadrover/actions-runner/_work/2bytes.loadrover-server/2bytes.loadrover-server/ ~/loadrover/live-directory/

      - name: Kill process
        run: kill -9 $(lsof -ti :8800) || true

      # gradle build 를 위한 jdk 사용
#      - name: Set up JDK 17
#        uses: actions/setup-java@v2
#        with:
#          java-version: "17"
#          distribution: "temurin"

      # ./gradlew 권한 설정
#      - name: Run chmod to make gradlew executable
#        run: chmod +x ./gradlew

