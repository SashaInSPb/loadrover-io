spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mariadb://localhost:3306/loadrover
    username: root
    password: hiworld
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDB103Dialect
    defer-datasource-initialization: true
    show-sql: true
    generate-ddl: true
    open-in-view: true
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        auto_quote_keyword: true

server:
  port: 8800
  servlet:
    encoding:
      force-response: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**

loadrover:
  gatling:
    path: gatling/src/gatling/resources/static
    source: source
    progress: progress
    work: work
    work-path: gatling/src/gatling/kotlin
    complete: complete
    result: result
    image-path: gatling/src/gatling/resources/image
  output:
    class-name-prefix: "local"