spring:
  main:
    allow-bean-definition-overriding: true

#logging:
#  level:
#    root: INFO
#    org.springframework.web: DEBUG
#    com.yourpackage: DEBUG
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

server:
  servlet:
    encoding:
      force-response: true
  port: 8800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: desc
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /**

loadrover:
  gatling:
    path: ../gatling/src/gatling/resources/static
    source: source
    progress: progress
    work: work
    work-path: gatling/src/gatling/kotlin
    complete: complete
    result: result
  output:
    class-name-prefix: "local"