<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns="http://www.w3.org/1999/html"
      layout:decorate="layout/default_layout">


<th:block layout:fragment="script">
    <script th:inline="javascript">

        // sweetAlert for bootstrap
        const swalWithBootstrapButtons = Swal.mixin({
            customClass: {
                confirmButton: 'btn btn-primary',
                cancelButton: 'btn btn-gray'
            },
            buttonsStyling: false
        });

        // applying function while reloading page
        $(document).ready(function() {

            // project register submit event
            $('#registerForm').on("submit", function(e) {
                e.preventDefault();

                let formData = new FormData();
                formData.append("mediaRegisterRequest", new Blob([JSON.stringify({
                    "title": $("#title").val(),
                    "clientName": $("#clientName").val(),
                    "startDateTime": $("#startDateTime").val(),
                    "endDateTime": $("#endDateTime").val()
                })], {
                        type: "application/json"
                }));

                $.ajax({
                    type: "POST",
                    url: "/project",
                    data: formData,
                    cache: false,
                    processData: false,
                    contentType: false,
                    success: function(data, status, xr) {
                        swalWithBootstrapButtons.fire({
                            icon: 'success',
                            title: '등록 완료',
                            text: '정상적으로 처리되었습니다.',
                            showConfirmButton: false,
                            timer: 2000
                        })
                        setTimeout(function(){
                            window.location.reload();
                        }, 2100);
                    },
                    error: function(xhr, status, error) {
                        console.log(status.toString())
                        swalWithBootstrapButtons.fire({
                            icon: 'error',
                            title: '등록 실패',
                            text: xhr.responseText,
                            footer: '오류가 지속되면 관리자에게 문의해주세요.'
                        })
                    }
                });
            });

            // Retrieve task list info by project
            $(document).on("click", "#projectTable tbody tr", function(e) {
                e.preventDefault();

                // 데이터 내 공백 제거
                let projectId = $(this).find('td').eq(0).text().replace(/\s+/g, '');

                $.ajax({
                url: "/task/list",
                type: "GET",
                dataType: 'text',
                data: {
                    projectId: projectId
                },
                success: function(data) {
                    console.log(data)
                    let taskList = JSON.parse(data);
                    let html = "";

                    $.each(taskList, function(index, task) {
                        html += '<tr>' +
                                    '<td style="vertical-align: middle">' + '<span>' + task.taskId + '</span>' + '</td>' +
                                    '<td style="vertical-align: middle">' + '<span>' + task.title + '</span>' + '</td>' +
                                    '<td style="vertical-align: middle">' + '<span>' + task.uploadFileName + '</span>' + '</td>' +
                                    '<td style="vertical-align: middle">' + '<span>' + task.hostList + '</span>'+ '</td>' +
                                    '<td style="vertical-align: middle">' + '<span>' + '<button type="button" class="btn btn-sm btn-secondary" data-bs-toggle="modal" data-bs-target="#modal-form-media-w" style="margin-bottom: 3px;">' + '변경' + '</button>' + '</span>'+ '</td>' +
                                    '<td style="vertical-align: middle">' + '<span>' + '</span>'+ '</td>' +
                                '</tr>';
                    });

                    // Applying task list data to table
                    $('#taskTable tbody').html(html);
                },
                error: function(xhr) {
                    console.error("Error loading tasks: " + xhr.statusText);
                }
            });
        });
    });

    </script>
</th:block>
