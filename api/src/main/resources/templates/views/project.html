<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns="http://www.w3.org/1999/html"
      layout:decorate="layout/default_layout">


<th:block layout:fragment="script">
    <script th:inline="javascript">

        // sweetAlert for bootstrap
        const swalWithBootstrapButtons = Swal.mixin({
            customClass: {
                confirmButton: 'btn btn-primary',
                cancelButton: 'btn btn-gray'
            },
            buttonsStyling: false
        });

        // applying function while reloading page
        $(document).ready(function() {
            console.log("check document")
            let projectId;

            // project register submit event start
            $('#projectRegisterForm').on("submit", function(e) {
                e.preventDefault();

                let projectCreateRequest = {
                    title: $("#title").val(),
                    clientName: $("#clientName").val(),
                    startDateTime: $("#startDateTime").val(),
                    endDateTime: $("#endDateTime").val()
                };

                $.ajax({
                    url: "/project",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(projectCreateRequest),
                    success: function(data, status, xr) {
                        swalWithBootstrapButtons.fire({
                            icon: 'success',
                            title: '등록 완료',
                            text: '정상적으로 처리되었습니다.',
                            showConfirmButton: false,
                            timer: 2000
                        })
                        setTimeout(function(){
                            window.location.reload();
                        }, 2100);
                    },
                    error: function(xhr, status, error) {
                        console.log(status.toString())
                        swalWithBootstrapButtons.fire({
                            icon: 'error',
                            title: '등록 실패',
                            text: xhr.responseText,
                            footer: '오류가 지속되면 관리자에게 문의해주세요.'
                        })
                    }
                });
            });
            // project register submit event end

            // project update submit event
            $("#projectUpdateForm").on("submit", function(e) {
                e.preventDefault();

                let projectUpdateRequest = {
                    projectId: $("#u_projectId").val(),
                    title: $("#u_title").val(),
                    clientName: $("#u_clientName").val(),
                    startDateTime: $("#u_startDateTime").val(),
                    endDateTime: $("#u_endDateTime").val()
                };

                $.ajax({
                    url: "/project",
                    type: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(projectUpdateRequest),
                    success: function(data, status, xr) {
                        swalWithBootstrapButtons.fire({
                            icon: 'success',
                            title: '수정 완료',
                            text: '정상적으로 처리되었습니다.',
                            showConfirmButton: false,
                            timer: 2000
                        })
                        window.location.reload();
                    },
                    error: function(xhr, status, error) {
                        swalWithBootstrapButtons.fire({
                            icon: 'error',
                            title: '수정 실패',
                            text: xhr.responseText,
                            footer: '오류가 지속되면 관리자에게 문의해주세요.'
                        })
                    }
                });
            });

            // task register submit event start
            $('#taskRegisterForm').on("submit", function(e) {
               e.preventDefault();
               console.log($("#t_projectId").val())

               let formData = new FormData();
               formData.append("scenarioFile", $("#scenarioFile")[0].files[0]);
               formData.append("taskCreateRequest", new Blob([JSON.stringify({
                    "projectId": projectId,
                    "title": $("#taskTitle").val(),
                    "host": null
                })], {
                        type: "application/json"
                }));

                console.log(formData)

                $.ajax({
                    url: "/task",
                    type: "POST",
                    data: formData,
                    cache: false,
                    contentType: false,
                    processData: false,
                    success: function(data, status, xr) {
                        swalWithBootstrapButtons.fire({
                            icon: 'success',
                            title: '등록 완료',
                            text: '정상적으로 처리되었습니다.',
                            showConfirmButton: false,
                            timer: 2000
                        })
                        setTimeout(function(){
                            window.location.reload();
                        }, 2100);
                    },
                    error: function(xhr, status, error) {
                        console.log(status.toString())
                        swalWithBootstrapButtons.fire({
                            icon: 'error',
                            title: '등록 실패',
                            text: xhr.responseText,
                            footer: '오류가 지속되면 관리자에게 문의해주세요.'
                        })
                    }
                });
            });
            // task register submit event end


            // Retrieve task list info by project
            $(document).on("click", "#projectTable tbody tr", function(e) {
                e.preventDefault();

                // 데이터 내 공백 제거
                projectId = $(this).find('td').eq(0).text().replace(/\s+/g, '');

                $.ajax({
                    url: "/task/list",
                    type: "GET",
                    dataType: 'text',
                    data: {
                        projectId: projectId
                    },
                    success: function(data) {
                        let taskList = JSON.parse(data);
                        let html = "";
                        let buttonComponent = '<button class="btn btn-sm btn-secondary" data-bs-toggle="modal" data-bs-target="#modal-form-task-register" style="margin-bottom: 3px;">' + '작업 추가' + '</button>';

                        // 프로젝트 선택 시에만 프로젝트 id 붙이기
                        if (projectId != null) {
                            $('#createTaskButton').html(buttonComponent);
                        }

                        $.each(taskList, function(index, task) {
                            html += '<tr>' +
                                        '<td style="vertical-align: middle">' + '<span>' + task.taskId + '</span>' + '</td>' +
                                        '<td style="vertical-align: middle">' + '<span>' + task.title + '</span>' + '</td>' +
                                        '<td style="vertical-align: middle"><a href="' + task.reportPath + '" target="_blank">' + task.reportPath + '</a></td>' +
                                        '<td style="vertical-align: middle">' + '<span>' + task.hostList + '</span>'+ '</td>' +
                                        '<td style="vertical-align: middle">' + '<span>' + '<button type="button" class="btn btn-sm btn-secondary" data-bs-toggle="modal" data-bs-target="#modal-form-task-update" style="margin-bottom: 3px;">' + '수정하기' + '</button>' + '</span>'+ '</td>' +
                                        '<td style="vertical-align: middle">' + '<span>' + '<button type="button" class="btn btn-sm btn-secondary" data-bs-toggle="modal" data-bs-target="#modal-form-task-execution" data-task-id="' + task.taskId + '" style="margin-bottom: 3px" id="runBtn";>' + '실행하기' + '</button>' + '</span>'+ '</td>' +
                                    '</tr>';
                        });

                        $('#taskTable tbody').html(html);
                    },
                    error: function(xhr) {
                        console.error("Error loading tasks: " + xhr.statusText);
                    }
                });
            });
        });

        $(document).on("click", "#runBtn", function(e) {
            e.preventDefault();
            // 여기가 문제
            let taskId = $(this).data('task-id');
            console.log("taskId:", taskId);

            $.ajax({
                    url: "/run/" + taskId,
                    type: "GET",
                    success: function(data, status, xr) {
                        swalWithBootstrapButtons.fire({
                            icon: 'success',
                            title: 'test initialized',
                            text: '테스트를 시작합니다.',
                            showConfirmButton: false, // 확인 버튼유무
                            timer: 2000
                        })
                        setTimeout(function() {
                            window.location.reload();
                        }, 2100);
                    },
                error: function(xhr, status, error) {
                    swalWithBootstrapButtons.fire({
                        icon: 'error',
                        title: 'test failed',
                        text: '오류가 발생하였습니다. 다시 시도해주세요.',
                        footer: '오류가 지속되면 관리자에게 문의해주세요.'
                    })
                }
            });
        })

        function updateProjectInit(projectId) {
            let projectList = JSON.parse($("#projectListJsonString").val());
            let previousProject = projectList.find(project => project.projectId === (projectId * 1));
            console.log(previousProject)

            $("#u_projectId").val(projectId);
            $("#u_title").val(previousProject.title);
            $("#u_clientName").val(previousProject.clientName);
            $("#u_startDateTime").val(previousProject.startDateTime);
            $("#u_endDateTime").val(previousProject.endDateTime);
        }

    </script>
</th:block>
